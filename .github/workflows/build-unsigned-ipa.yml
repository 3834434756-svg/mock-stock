# ============================================================================
# 云端打包「未签名 IPA」—— 模拟股神（原生 SwiftUI 项目）
#
# 工程由 XcodeGen 现场生成（仓库里不存 .xcodeproj）。
# 产物是未签名 IPA，需用 Sideloadly + 免费 Apple ID 重签后安装。
# ============================================================================

name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  # 锁定 macos-15 / Xcode 16.4：不要用 macos-latest（移动标签，会漂移）
  XCODE_PATH: /Applications/Xcode_16.4.app
  PROJECT_NAME: MockStock
  SCHEME: MockStock
  PRODUCT_NAME: MockStock

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 环境探测
        run: |
          set -euxo pipefail
          sw_vers
          uname -m
          xcode-select -p
          xcodebuild -version

      - name: 选择 Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: 安装 XcodeGen 并生成工程
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version
          xcodegen generate
          ls -la

      - name: 确认 scheme 可用
        run: |
          set -euo pipefail
          xcodebuild -project "$PROJECT_NAME.xcodeproj" -list

      - name: Archive（关闭代码签名）
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/build/App.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -400

      - name: 打包成未签名 IPA
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/build/App.xcarchive"
          APP="$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "::error::archive 里没有找到 .app"
            exit 1
          fi
          echo "App: $APP"
          mkdir -p "$RUNNER_TEMP/out/Payload"
          # ditto 保留符号链接与扩展属性；丢了会导致装不上
          ditto "$APP" "$RUNNER_TEMP/out/Payload/$(basename "$APP")"
          cd "$RUNNER_TEMP/out"
          zip -qry "${PRODUCT_NAME}-unsigned.ipa" Payload
          rm -rf Payload
          ls -lh "${PRODUCT_NAME}-unsigned.ipa"

      - name: 校验产物确实是未签名的
        run: |
          set -euo pipefail
          IPA="$RUNNER_TEMP/out/${PRODUCT_NAME}-unsigned.ipa"
          unzip -l "$IPA" | head -30
          if unzip -l "$IPA" | grep -q '_CodeSignature/'; then
            echo "::error::产物里出现 _CodeSignature/，签名没关干净"
            exit 1
          fi
          if unzip -l "$IPA" | grep -q 'embedded.mobileprovision'; then
            echo "::error::产物里出现 embedded.mobileprovision，这不是未签名包"
            exit 1
          fi
          echo "✅ 已确认是未签名 IPA"

      - name: 上传 Artifact（需登录 GitHub 才能下载）
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: ${{ runner.temp }}/out/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 发布到 Release（免登录下载链接）
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IPA="$RUNNER_TEMP/out/${PRODUCT_NAME}-unsigned.ipa"
          TAG="build-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" "$IPA" \
            --title "${PRODUCT_NAME} 未签名 IPA ${TAG}" \
            --notes "模拟股神 · 未签名 IPA。需用 Sideloadly + 免费 Apple ID 重签后安装，有效期 7 天。" \
            --latest
          echo "下载页: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
